<!DOCTYPE html>
<html>
<head>
    <title>Tieu de trang</title>
</head>
<body>

<form name="myform">
    <h3>Select Language:</h3>

    <input type="radio" name="language" id="rad1"
        onclick="
            id_div_vi.style.display='block';
            id_div_en.style.display='none';
            id_div_fr.style.display='none';
            id_div_zh.style.display='none';
            id_div_ja.style.display='none';
        ">
    <label for="rad1">Vietnamese</label><br>

    <input type="radio" name="language" id="rad2"
        onclick="
            id_div_vi.style.display='none';
            id_div_en.style.display='block';
            id_div_fr.style.display='none';
            id_div_zh.style.display='none';
            id_div_ja.style.display='none';
        ">
    <label for="rad2">English</label><br>

    <input type="radio" name="language" id="rad3"
        onclick="
            id_div_vi.style.display='none';
            id_div_en.style.display='none';
            id_div_fr.style.display='block';
            id_div_zh.style.display='none';
            id_div_ja.style.display='none';
        ">
    <label for="rad3">French</label><br>

    <input type="radio" name="language" id="rad4"
        onclick="
            id_div_vi.style.display='none';
            id_div_en.style.display='none';
            id_div_fr.style.display='none';
            id_div_zh.style.display='block';
            id_div_ja.style.display='none';
        ">
    <label for="rad4">Chinese</label><br>

    <input type="radio" name="language" id="rad5"
        onclick="
            id_div_vi.style.display='none';
            id_div_en.style.display='none';
            id_div_fr.style.display='none';
            id_div_zh.style.display='none';
            id_div_ja.style.display='block';
        ">
    <label for="rad5">Japanese</label><br>

    <div id="id_div_vi" style="display:block">
        <h4>Xin chào</h4>
    </div>

    <div id="id_div_en" style="display:none">
        <h4>Hello</h4>
    </div>

    <div id="id_div_fr" style="display:none">
        <h4>Bonjour</h4>
    </div>

    <div id="id_div_zh" style="display:none">
        <h4>你好</h4>
    </div>

    <div id="id_div_ja" style="display:none">
        <h4>こんにちは</h4>
    </div>

</form>

</body>
</html>
