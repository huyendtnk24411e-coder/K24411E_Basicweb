<html>
    <head>
        <title>Tiêu đề trang</title>
        <script>
        function maxValue() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            var c = Number(document.getElementById("c").value);
            document.getElementById("result").value = Math.max(a,b,c);
        }
        function minValue() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            var c = Number(document.getElementById("c").value);
            document.getElementById("result").value = Math.min(a,b,c);
        }
        function sinA() {
            var a = Number(document.getElementById("a").value);
            document.getElementById("result").value =
                Math.sin(a * Math.PI / 180);
            }
        function cosA() {
            var a = Number(document.getElementById("a").value);
            document.getElementById("result").value =
                Math.cos(a * Math.PI / 180);
        }
        function powerAB() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            document.getElementById("result").value =
                Math.pow(a,b);
        }
    </script>
    </head>
    <body>
        <table border="1">
    <tr>
        <td>a:</td>
        <td><input type="text" id="a"></td>
    </tr>
    <tr>
        <td>b:</td>
        <td><input type="text" id="b"></td>
    </tr>
    <tr>
        <td>c:</td>
        <td><input type="text" id="c"></td>
    </tr>
    <tr>
        <td>Result:</td>
        <td><input type="text" id="result"></td>
    </tr>
    <tr>
        <td>
            <input type="button" value="MAX" onclick="maxValue()">
            <input type="button" value="MIN" onclick="minValue()">
            <input type="button" value="sin(a)" onclick="sinA()">
            <input type="button" value="cos(a)" onclick="cosA()">
            <input type="button" value="a^b" onclick="powerAB()">
        </td>
    </tr>
</table>
    </body>
</html>
